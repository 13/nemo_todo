name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Tags do not run this directly. release.yml calls it, so a release runs
  # exactly the checks a push runs and then publishes on top of them.
  workflow_call:

env:
  # Pinned so a Flutter release cannot break the build with no change on
  # our side. Bump deliberately, together with the Dockerfile.
  FLUTTER_VERSION: '3.47.2'

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      # Generated sources are committed and nothing else here regenerates
      # them, so a stale .g.dart would otherwise sail through every check.
      # The schema snapshots are held to the same rule: they are what the
      # next migration gets written against, so a schema edit that does not
      # re-dump them has to fail here rather than at someone's first upgrade.
      - name: Verify generated code is current
        run: |
          (cd app && flutter gen-l10n)
          (cd packages/nemo_core && dart run build_runner build)
          (cd server && dart run build_runner build)
          (cd app && dart run build_runner build)
          (cd server && dart run drift_dev schema dump \
            lib/src/db/server_database.dart drift_schemas/)
          (cd server && dart run drift_dev schema generate \
            drift_schemas/ test/generated/)
          (cd app && dart run drift_dev schema dump \
            lib/core/db/app_database.dart drift_schemas/)
          if ! git diff --quiet; then
            echo "::error::Generated files are out of date. Regenerate and commit:"
            git diff --name-only | sed 's/^/  /'
            exit 1
          fi

      - name: Verify formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            packages/nemo_core/lib packages/nemo_core/test \
            server/lib server/bin server/test \
            app/lib app/test tool

      # A launcher icon nobody replaced ships the wrong brand while every
      # other check stays green, which is exactly what happened once.
      - name: Check icons
        run: tool/check_icons.sh

      - name: Analyze
        run: flutter analyze

      # dart test writes its own JSON hit map rather than lcov, so each
      # pure-Dart package is converted before the shared checker reads it.
      # The floors sit just under what each package measures today; the
      # server holds the authorisation rules, so it is the last place that
      # should be able to lose tests unnoticed.
      - name: Test nemo_core
        run: |
          dart test --coverage=coverage
          dart run coverage:format_coverage --lcov --in=coverage \
            --out=coverage/lcov.info --report-on=lib --base-directory=.
          dart run ../../tool/check_coverage.dart 90
        working-directory: packages/nemo_core

      - name: Test server
        run: |
          dart test --coverage=coverage
          dart run coverage:format_coverage --lcov --in=coverage \
            --out=coverage/lcov.info --report-on=lib --base-directory=.
          dart run ../tool/check_coverage.dart 85
        working-directory: server

      - name: Test app
        run: flutter test --coverage --exclude-tags design
        working-directory: app

      - name: Check coverage floor
        run: dart run ../tool/check_coverage.dart 80
        working-directory: app

  build:
    name: Build web, APK and image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - run: flutter pub get

      - name: Fetch web database assets
        run: tool/fetch_web_assets.sh

      - name: Build web
        run: flutter build web --release --no-web-resources-cdn
        working-directory: app

      # Signed with the release keystore when the secrets are present, and
      # with the debug key otherwise, which is fine for a CI artefact but
      # never for a release: the release job below requires the keystore.
      # The `secrets` context cannot be read from a step's `if`, so the
      # keystore is mapped into the environment and tested from there.
      # Without it the APK is signed with the debug key, which is fine for
      # a CI artefact and never for a release.
      # flutter_secure_storage 11 compiles against API 37, so the app does
      # too, and a runner image ships whichever platforms it shipped with.
      # Installing it here costs seconds; finding out it is missing costs a
      # failed build, or a failed release.
      - name: Install the Android platform the build compiles against
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-37.0' > /dev/null

      - name: Configure signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "no keystore secret; the APK will use the debug key"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > app/android/nemo.jks
          cat > app/android/key.properties <<PROPS
          storeFile=nemo.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build APK
        run: flutter build apk --release --split-per-abi
        working-directory: app

      # These carry the app name and version; Flutter's own copies under
      # flutter-apk keep the generic names its tooling looks for.
      - uses: actions/upload-artifact@v5
        with:
          name: nemo-apk
          path: app/build/app/outputs/release/*.apk
          if-no-files-found: error

      - name: Build the server image
        run: docker build -t nemo:${{ github.sha }} .

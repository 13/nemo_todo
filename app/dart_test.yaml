tags:
  # Renders each screen to build/screens/*.png for a look at the design.
  # The images are build output, not stored golden assertions, so there is
  # nothing to compare against on a fresh checkout: the tests skip
  # themselves unless asked to render. Refresh the images with:
  #   flutter test test/design --update-goldens
  design:
    skip: false
  # Dates on either side of a daylight saving change. They hold in any time
  # zone and run in the normal run; CI runs them again where the clocks
  # move, so tag any new one:
  #   TZ=Europe/Berlin flutter test --tags dst
  dst:

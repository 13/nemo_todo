name: nemo
description: nemo - a local-first todo app for Android and Web.
version: 0.2.0+2
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  collection: ^1.19.0
  crypto: ^3.0.7
  device_info_plus: ^13.2.0
  dio: ^5.11.1
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.0.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  intl: ^0.20.2
  json_annotation: ^4.12.0
  meta: ^1.16.0
  nemo_core:
    path: ../packages/nemo_core
  open_filex: ^4.7.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.5
  riverpod_annotation: ^4.0.7
  timezone: ^0.11.1
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.34.4
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  # Test-only: one test drives the app's sync client against the real
  # server rather than a fake of it, which needs the server package and the
  # one line of shelf that puts its handler on a port.
  nemo_server:
    path: ../server
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.8
  shelf: ^1.4.2
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800

<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A local-first todo app that syncs with your own server.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="nemo todo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="theme-color" content="#0E7C86">
  <title>nemo todo</title>
  <link rel="manifest" href="manifest.json">

  <!--
    The loading screen, shown from the first paint until the app draws its
    first frame and lib/core/splash takes it down. Until then the engine,
    the compiled app and the database all have to load, which is long
    enough that a blank page reads as broken. Styles only: the server's
    content security policy allows inline styles, not inline scripts.
    Colours are the app theme's scaffold background and primary.
  -->
  <style>
    /* The light theme, the dark one where the device is dark, and whichever
       the app is set to where it has said: the server marks the html element with
       data-theme from the cookie the app leaves (server static_handler). */
    :root { --bg: #F5F8F8; --mark: #0E7C86; --ring: rgba(14, 124, 134, 0.18); }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0E1616; --mark: #5BC0C9; --ring: rgba(91, 192, 201, 0.18);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0E1616; --mark: #5BC0C9; --ring: rgba(91, 192, 201, 0.18);
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #splash {
      position: fixed; inset: 0; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--mark);
      transition: opacity 300ms ease-out;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash .mark { position: relative; width: 96px; height: 96px; }
    #splash .mark svg { position: absolute; inset: 16px; width: 64px; height: 64px; }
    #splash .ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 3px solid var(--ring); border-top-color: currentColor;
      animation: splash-spin 900ms linear infinite;
    }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #splash .ring { animation: none; border-color: transparent; }
      #splash .mark svg { animation: splash-pulse 1.6s ease-in-out infinite alternate; }
      @keyframes splash-pulse { to { opacity: 0.5; } }
    }
  </style>
</head>
<body>
  <div id="splash" role="progressbar" aria-label="Loading nemo todo">
    <div class="mark">
      <div class="ring"></div>
      <svg viewBox="56 56 400 400" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M 56 256 A 200 200 0 1 0 456 256 A 200 200 0 1 0 56 256 Z M 127.87 265.42 L 206.87 343.42 A 31.5 31.5 0 0 0 251.10 343.45 L 381.10 215.45 A 31.5 31.5 0 0 0 381.45 170.90 A 31.5 31.5 0 0 0 336.90 170.55 L 229.03 276.76 L 172.13 220.58 A 31.5 31.5 0 0 0 127.58 220.87 A 31.5 31.5 0 0 0 127.87 265.42 Z"/></svg>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
